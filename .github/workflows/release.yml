# Pubblica una release di CUS quando si fa push di un tag vX.Y.Z:
# - Windows: test, scripts/publish.ps1 (app self-contained + installer Inno Setup) e zip della cartella;
# - Linux, per x64 e arm64: tar.gz, .deb, .rpm e AppImage, tutti self-contained (non serve .NET sul PC
#   di destinazione), costruiti da packaging/linux/build-packages.sh e provati prima di pubblicarli;
# - una GitHub Release con tutti i pacchetti e SHA256SUMS.txt.
# Niente suffissi (-beta.1): VersionInfoVersion in installer/cus.iss accetta solo numeri.
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# Avvio manuale (Actions → Release → Run workflow, con un tag già rilasciato): costruisce solo i pacchetti
# Linux e aggiunge alla release esistente quelli che mancano, senza ricostruire né sostituire i file già
# pubblicati.
#
# Sicurezza:
# - I job che eseguono il codice del repository e i pacchetti NuGet hanno un token di sola lettura;
#   solo "publish", che non fa checkout né esegue codice del repository, può scrivere (crea la release).
# - Le action sono fissate per SHA del commit (il commento dice la versione): un tag spostato non cambia
#   cosa gira qui. Dependabot (.github/dependabot.yml) propone gli aggiornamenti.
# - Il nome del tag non entra mai negli script con ${{ }}: passa da una variabile d'ambiente ed è
#   validato prima dell'uso, così un tag con apici o $(...) non può iniettare comandi.
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag già rilasciato (vX.Y.Z) a cui aggiungere i pacchetti Linux'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  INNO_SETUP_URL: https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe
  INNO_SETUP_SHA256: 8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0
  # Strumenti per i pacchetti Linux: versioni fissate con il loro SHA256 (i runner sono x64).
  NFPM_URL: https://github.com/goreleaser/nfpm/releases/download/v2.49.0/nfpm_2.49.0_Linux_x86_64.tar.gz
  NFPM_SHA256: 2afaa5ffb5e3493402e31e7c67a5a1fb42133e3f66fc315ca0051934125561c7
  APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
  APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
  APPIMAGE_RUNTIME_BASE_URL: https://github.com/AppImage/type2-runtime/releases/download/20251108
  APPIMAGE_RUNTIME_X86_64_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
  APPIMAGE_RUNTIME_AARCH64_SHA256: 00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Versione dal tag
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Tag non valido (atteso vX.Y.Z): $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    # All'avvio manuale la release Windows esiste già: i suoi file non si ricostruiscono.
    if: github.event_name == 'push'
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: refs/tags/${{ needs.version.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      # Cus.Platform.Windows.Tests è escluso: tocca la clipboard di sistema e richiede una
      # sessione desktop interattiva, che il runner non garantisce. Va eseguito in locale prima del tag.
      - name: Test
        run: |
          dotnet test tests/Cus.Core.Tests/Cus.Core.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/Cus.IntegrationTests/Cus.IntegrationTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Inno Setup 7 non è sul runner né su Chocolatey: installer ufficiale con hash verificato.
      - name: Installa Inno Setup
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest -Uri $env:INNO_SETUP_URL -OutFile $setup
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash
          if ($hash -ne $env:INNO_SETUP_SHA256) { throw "SHA256 di Inno Setup non corrisponde: $hash" }
          $dir = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          Start-Process $setup -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/CURRENTUSER', "/DIR=$dir"
          $iscc = Join-Path $dir 'ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe non trovato in $dir" }
          "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Pubblica e crea l'installer
        run: ./scripts/publish.ps1 -Version $env:VERSION -Iscc $env:ISCC

      - name: Zip della versione portabile
        run: Compress-Archive -Path artifacts/publish/win-x64/* -DestinationPath "artifacts/installer/cus-$env:VERSION-win-x64.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: artifacts/installer/
          if-no-files-found: error
          retention-days: 7

  linux:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      # Un'architettura che fallisce non ferma l'altra: l'errore di ognuna resta visibile.
      fail-fast: false
      matrix:
        rid: [linux-x64, linux-arm64]
    env:
      VERSION: ${{ needs.version.outputs.version }}
      RID: ${{ matrix.rid }}
      # Gli script di pacchettizzazione vengono dal commit di questo workflow, i sorgenti dal tag: all'avvio
      # manuale su un tag vecchio gli script potrebbero non esserci ancora. Al push di un tag coincidono.
      PACKAGING: ${{ github.workspace }}/.release-tools/packaging/linux
      CUS_SOURCE_DIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: refs/tags/${{ needs.version.outputs.tag }}
          persist-credentials: false

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: packaging
          persist-credentials: false

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      # I test della piattaforma Linux (Xvfb + Secret Service) girano nel workflow Linux a ogni push su main.
      - name: Test
        if: matrix.rid == 'linux-x64'
        run: |
          dotnet test tests/Cus.Core.Tests/Cus.Core.Tests.csproj -c Release
          dotnet test tests/Cus.IntegrationTests/Cus.IntegrationTests.csproj -c Release

      - name: Strumenti di pacchettizzazione
        run: |
          tools="$RUNNER_TEMP/tools"
          mkdir -p "$tools"
          fetch() { # url, sha256, destinazione
            curl -fsSL --retry 3 -o "$3" "$1"
            echo "$2  $3" | sha256sum -c -
          }
          fetch "$NFPM_URL" "$NFPM_SHA256" "$tools/nfpm.tar.gz"
          tar -xzf "$tools/nfpm.tar.gz" -C "$tools" nfpm
          fetch "$APPIMAGETOOL_URL" "$APPIMAGETOOL_SHA256" "$tools/appimagetool"
          chmod +x "$tools/appimagetool"
          if [[ "$RID" == linux-x64 ]]; then
            runtime=runtime-x86_64; runtime_sha=$APPIMAGE_RUNTIME_X86_64_SHA256
          else
            runtime=runtime-aarch64; runtime_sha=$APPIMAGE_RUNTIME_AARCH64_SHA256
          fi
          fetch "$APPIMAGE_RUNTIME_BASE_URL/$runtime" "$runtime_sha" "$tools/$runtime"
          {
            echo "NFPM=$tools/nfpm"
            echo "APPIMAGETOOL=$tools/appimagetool"
            echo "APPIMAGE_RUNTIME=$tools/$runtime"
          } >> "$GITHUB_ENV"

      # arm64 si compila da x64: l'app è .NET gestito e le librerie native arrivano già per architettura
      # dai pacchetti NuGet.
      - name: Pacchetti (tar.gz, deb, rpm, AppImage)
        run: '"$PACKAGING/build-packages.sh" "$VERSION" "$RID" artifacts/release'

      # Solo x64, l'architettura dei runner: il .deb si installa con apt (che verifica le dipendenze),
      # il .rpm in un container Fedora, e .deb e AppImage si avviano davvero.
      - name: Prova dei pacchetti
        if: matrix.rid == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth gnome-keyring dbus
          sudo apt-get install -y "./artifacts/release/cus_${VERSION}_amd64.deb"
          "$PACKAGING/smoke-test.sh" /usr/bin/cus
          # L'AppImage si estrae (prova anche il runtime) e si avvia il suo AppRun: lanciata direttamente,
          # timeout fermerebbe solo il runtime e CUS resterebbe aperto.
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/artifacts/release/cus-$VERSION-x86_64.AppImage" --appimage-extract > /dev/null)
          "$PACKAGING/smoke-test.sh" "$RUNNER_TEMP/squashfs-root/AppRun"
          docker run --rm -v "$PWD/artifacts/release:/packages:ro" fedora:42 bash -euo pipefail -c '
            dnf install -y -q "/packages/cus-$0-1.x86_64.rpm"
            test -x /usr/bin/cus
            if ldd /opt/cus/libSkiaSharp.so /opt/cus/libsodium.so /opt/cus/libsqlite3mc.so | grep "not found"; then exit 1; fi
          ' "$VERSION"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.rid }}
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [version, windows, linux]
    # Windows è saltato all'avvio manuale: basta che nessun job sia fallito.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write   # serve solo per creare o completare la release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: release-files

      - name: Crea o completa la GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd release-files
          files=(*)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # Release esistente: si aggiungono solo i file che mancano (quelli pubblicati non si sostituiscono)
            # e si aggiorna l'elenco degli hash, che resta valido anche per i file pubblicati prima.
            mapfile -t published < <(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            missing=()
            for file in "${files[@]}"; do
              [[ " ${published[*]} " == *" $file "* ]] || missing+=("$file")
            done
            if [[ ${#missing[@]} -eq 0 ]]; then
              echo "Niente da aggiungere: la release ha già tutti i pacchetti."
              exit 0
            fi
            mkdir ../previous
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS.txt --dir ../previous || touch ../previous/SHA256SUMS.txt
            gh release upload "$TAG" "${missing[@]}" --repo "$GITHUB_REPOSITORY"
            { cat ../previous/SHA256SUMS.txt; sha256sum "${missing[@]}"; } | sort -k2 -u > SHA256SUMS.txt
            gh release upload "$TAG" SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
          else
            sha256sum "${files[@]}" > SHA256SUMS.txt
            gh release create "$TAG" "${files[@]}" SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag --title "CUS $VERSION"
          fi
