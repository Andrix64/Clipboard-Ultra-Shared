# Pubblica una release di CUS quando si fa push di un tag vX.Y.Z: test, scripts/publish.ps1
# (app self-contained + installer Inno Setup) e GitHub Release con installer e zip della
# cartella pubblicata. Niente suffissi (-beta.1): VersionInfoVersion in installer/cus.iss
# accetta solo numeri.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Sicurezza:
# - Due job: "build" esegue il codice del repository e i pacchetti NuGet con un token di sola lettura;
#   solo "publish", che non fa checkout né esegue codice del repository, può scrivere (crea la release).
# - Le action sono fissate per SHA del commit (il commento dice la versione): un tag spostato non cambia
#   cosa gira qui. Dependabot (.github/dependabot.yml) propone gli aggiornamenti.
# - Il nome del tag non entra mai negli script con ${{ }}: passa da una variabile d'ambiente ed è
#   validato prima dell'uso, così un tag con apici o $(...) non può iniettare comandi.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  INNO_SETUP_URL: https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe
  INNO_SETUP_SHA256: 8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Versione dal tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ($env:TAG -notmatch '^v(\d+\.\d+\.\d+)\z') { throw "Tag non valido (atteso vX.Y.Z): $env:TAG" }
          $version = $Matches[1]
          "version=$version" >> $env:GITHUB_OUTPUT
          "VERSION=$version" >> $env:GITHUB_ENV

      # Cus.Platform.Windows.Tests è escluso: tocca la clipboard di sistema e richiede una
      # sessione desktop interattiva, che il runner non garantisce. Va eseguito in locale prima del tag.
      - name: Test
        run: |
          dotnet test tests/Cus.Core.Tests/Cus.Core.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/Cus.IntegrationTests/Cus.IntegrationTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Inno Setup 7 non è sul runner né su Chocolatey: installer ufficiale con hash verificato.
      - name: Installa Inno Setup
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest -Uri $env:INNO_SETUP_URL -OutFile $setup
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash
          if ($hash -ne $env:INNO_SETUP_SHA256) { throw "SHA256 di Inno Setup non corrisponde: $hash" }
          $dir = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          Start-Process $setup -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/CURRENTUSER', "/DIR=$dir"
          $iscc = Join-Path $dir 'ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe non trovato in $dir" }
          "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Pubblica e crea l'installer
        run: ./scripts/publish.ps1 -Version $env:VERSION -Iscc $env:ISCC

      - name: Zip della versione portabile
        run: |
          Compress-Archive -Path artifacts/publish/win-x64/* -DestinationPath "artifacts/installer/cus-$env:VERSION-win-x64.zip"
          # Elenco preso prima di creare SHA256SUMS.txt: il file non deve finire nel proprio elenco.
          $files = @(Get-ChildItem artifacts/installer -File)
          $files | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content artifacts/installer/SHA256SUMS.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: artifacts/installer/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write   # serve solo per creare la release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release-files

      - name: Crea la GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$TAG" release-files/* \
            --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag --title "CUS $VERSION"
