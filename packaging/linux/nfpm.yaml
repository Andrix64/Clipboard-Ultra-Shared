# Pacchetti .deb e .rpm di CUS, costruiti con nfpm da build-packages.sh, che imposta le variabili
# ${...}: VERSION, NFPM_ARCH (amd64 | arm64), PUBLISH_DIR (app self-contained), ASSETS_DIR (icona).
# L'app si installa in /opt/cus, con il comando /usr/bin/cus, il lanciatore e l'icona.
name: cus
arch: ${NFPM_ARCH}
platform: linux
version: ${VERSION}
release: 1
section: utils
priority: optional
maintainer: Andrix64 <Andrix64@users.noreply.github.com>
homepage: https://github.com/Andrix64/Clipboard-Ultra-Shared
description: |-
  Clipboard Ultra Shared: share the clipboard in real time with other PCs on the local network.
  Text, images, files and folders, end-to-end encrypted. Needs an X11 or XWayland session and a
  Secret Service keyring (GNOME Keyring, KWallet or KeePassXC).

contents:
  - src: ${PUBLISH_DIR}
    dst: /opt/cus
    type: tree
  - src: /opt/cus/cus
    dst: /usr/bin/cus
    type: symlink
  - src: ./cus.desktop
    dst: /usr/share/applications/cus.desktop
    file_info:
      mode: 0644
  - src: ${ASSETS_DIR}/cus.png
    dst: /usr/share/icons/hicolor/256x256/apps/cus.png
    file_info:
      mode: 0644

overrides:
  deb:
    # Librerie del sistema che l'app self-contained usa: X11 (clipboard e finestre), fontconfig,
    # libsecret (chiave del database), ICU (testi e numeri nella lingua scelta).
    depends:
      - libc6
      - libgcc-s1
      - libstdc++6
      - zlib1g
      - libx11-6
      - libxfixes3
      - libice6
      - libsm6
      - libfontconfig1
      - libsecret-1-0
      - libicu76 | libicu74 | libicu72 | libicu71 | libicu70 | libicu67 | libicu66
    recommends:
      - gnome-keyring | kwalletmanager | keepassxc
  rpm:
    # Per nome di libreria e non di pacchetto: valgono su Fedora, RHEL e openSUSE, che chiamano i
    # pacchetti in modo diverso. ICU ha il numero di versione nel nome: solo raccomandata.
    depends:
      - libX11.so.6()(64bit)
      - libXfixes.so.3()(64bit)
      - libICE.so.6()(64bit)
      - libSM.so.6()(64bit)
      - libfontconfig.so.1()(64bit)
      - libsecret-1.so.0()(64bit)
      - libz.so.1()(64bit)
      - libstdc++.so.6()(64bit)
    recommends:
      - libicu
